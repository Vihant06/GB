    { name = "Vihant06", email = "vihantmhabadi947@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "gitpython>=3.1.43",
    "ipykernel>=6.29.5",
    "langchain-core>=0.3.28",
    "langchain-nvidia-ai-endpoints>=0.3.7",
    "langgraph>=0.2.60",
    "psycopg[binary]>=3.2.3",
    "pydantic>=2.10.0",
